<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anouar Iqqi | أنوار إقي</title>
  
  <meta name="description" content="الحسابات الرسمية للكوتش والرياضي أنوار إقي (Anouar Iqqi) - واتساب، إنستغرام، وفيسبوك.">
  <meta name="theme-color" content="#07090e">
  <meta property="og:image" content="PHOTO.jpeg">
  <link rel="icon" type="image/jpeg" href="PHOTO.jpeg">

  <!-- Google Fonts: Cairo & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Inline CSS: 100% Guaranteed to load instantly on Vercel, Netlify, and all hosts without 404 -->
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 24, 38, 0.72);
      --bg-card-hover: rgba(26, 36, 56, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 242, 152, 0.4);
      
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
      
      --neon-green: #00f298;
      --neon-blue: #00b4d8;
      --neon-glow: rgba(0, 242, 152, 0.35);

      --font-arabic: 'Cairo', system-ui, -apple-system, sans-serif;
      --font-latin: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-arabic), var(--font-latin);
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Animated Glow Spheres */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: orbDrift 14s infinite alternate ease-in-out;
    }

    .glow-orb-1 {
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #00f298 0%, rgba(0, 242, 152, 0) 70%);
    }

    .glow-orb-2 {
      bottom: -15%;
      right: -10%;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #00b4d8 0%, rgba(0, 180, 216, 0) 70%);
      animation-delay: -5s;
    }

    .glow-orb-3 {
      top: 50%;
      left: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #1877f2 0%, rgba(24, 119, 242, 0) 70%);
      animation-delay: -9s;
    }

    @keyframes orbDrift {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(30px) scale(1.1); }
      100% { transform: translateY(-25px) scale(0.95); }
    }

    /* Canvas for light floating dust */
    #dust-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
    }

    /* Mobile Screen Container */
    .mobile-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 2.2rem 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Profile Header Section */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.2rem;
      animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Avatar with Dynamic Multi-ring Glow */
    .avatar-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 1.25rem;
    }

    .avatar-ring-outer {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00f298, #00b4d8, #1877f2, #00f298);
      filter: blur(10px);
      opacity: 0.75;
      animation: spinHalo 9s linear infinite;
    }

    .avatar-ring-border {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00f298, #00b4d8, #1877f2, #00f298);
      animation: spinHalo 9s linear infinite;
    }

    @keyframes spinHalo {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .avatar-img-box {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #0f172a;
      border: 3px solid #07090e;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.4s ease;
    }

    .avatar-container:hover .avatar-img {
      transform: scale(1.08);
    }

    /* Verified Online Badge */
    .online-badge {
      position: absolute;
      bottom: 4px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #00f298;
      border: 3px solid #07090e;
      box-shadow: 0 0 12px #00f298;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: #07090e;
    }

    /* Name & Title */
    .profile-name {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      font-family: var(--font-latin), var(--font-arabic);
    }

    .verified-icon {
      color: #00f298;
      font-size: 1.25rem;
      filter: drop-shadow(0 0 8px rgba(0, 242, 152, 0.5));
    }

    .profile-tagline {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--neon-green);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 242, 152, 0.08);
      border: 1px solid rgba(0, 242, 152, 0.2);
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-top: 0.4rem;
    }

    /* Links Container */
    .links-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    /* Modern App-Style Link Button */
    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1.15rem 1.35rem;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      transition: width 0.3s ease;
    }

    .link-card:active {
      transform: scale(0.97);
    }

    .link-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.5);
    }

    /* WhatsApp Specific Styling */
    .link-card.whatsapp::before {
      background: #25d366;
    }
    .link-card.whatsapp:hover {
      border-color: rgba(37, 211, 102, 0.5);
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.25);
    }
    .link-card.whatsapp .link-icon-box {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
    }

    /* Instagram Specific Styling */
    .link-card.instagram::before {
      background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
    }
    .link-card.instagram:hover {
      border-color: rgba(220, 39, 67, 0.5);
      box-shadow: 0 10px 30px rgba(220, 39, 67, 0.25);
    }
    .link-card.instagram .link-icon-box {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
      box-shadow: 0 4px 15px rgba(220, 39, 67, 0.35);
    }

    /* Facebook Specific Styling */
    .link-card.facebook::before {
      background: #1877f2;
    }
    .link-card.facebook:hover {
      border-color: rgba(24, 119, 242, 0.5);
      box-shadow: 0 10px 30px rgba(24, 119, 242, 0.25);
    }
    .link-card.facebook .link-icon-box {
      background: linear-gradient(135deg, #1877f2, #0d5cc7);
      color: #fff;
      box-shadow: 0 4px 15px rgba(24, 119, 242, 0.35);
    }

    /* Phone Call Direct Styling */
    .link-card.phone::before {
      background: #00f298;
    }
    .link-card.phone:hover {
      border-color: rgba(0, 242, 152, 0.5);
      box-shadow: 0 10px 30px rgba(0, 242, 152, 0.25);
    }
    .link-card.phone .link-icon-box {
      background: linear-gradient(135deg, #00f298, #00b4d8);
      color: #07090e;
      box-shadow: 0 4px 15px rgba(0, 242, 152, 0.35);
    }

    /* Card Content Elements */
    .link-left {
      display: flex;
      align-items: center;
      gap: 1.15rem;
    }

    .link-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .link-card:hover .link-icon-box {
      transform: scale(1.1) rotate(5deg);
    }

    .link-text-content {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    body[dir="ltr"] .link-text-content {
      text-align: left;
    }

    .link-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
    }

    .link-subtitle {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 0.2rem;
      direction: ltr;
    }

    .link-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .link-card:hover .link-arrow {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: translateX(-4px);
    }

    body[dir="ltr"] .link-card:hover .link-arrow {
      transform: translateX(4px);
    }

    /* Staggered Animations */
    .link-card:nth-child(1) { animation-delay: 0.15s; }
    .link-card:nth-child(2) { animation-delay: 0.25s; }
    .link-card:nth-child(3) { animation-delay: 0.35s; }
    .link-card:nth-child(4) { animation-delay: 0.45s; }

    /* Quick Action Pills (Copy Number, vCard) */
    .quick-actions {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      margin-top: 0.5rem;
    }

    .btn-pill-action {
      flex: 1;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .btn-pill-action:active {
      transform: scale(0.96);
    }

    .btn-pill-action:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Footer Section */
    .profile-footer {
      text-align: center;
      margin-top: auto;
      padding-top: 1.5rem;
      animation: fadeIn 1s ease 0.5s both;
    }

    .footer-copy {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(16, 23, 38, 0.95);
      border: 1px solid var(--neon-green);
      border-radius: 999px;
      padding: 0.75rem 1.5rem;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px var(--neon-glow);
      z-index: 1000;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast-box.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Keyframe Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive adjust */
    @media (max-width: 400px) {
      .mobile-wrapper {
        padding: 1.75rem 1.1rem;
      }
      .avatar-container {
        width: 115px;
        height: 115px;
      }
      .profile-name {
        font-size: 1.65rem;
      }
      .link-card {
        padding: 1rem 1.15rem;
      }
    }
  </style>

  <!-- External Stylesheet Fallback -->
  <link rel="stylesheet" href="./css/style.css">
</head>

  <!-- Interactive JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initBackgroundCanvas();
      initActions();
    });

    /* Subtle ambient floating dust effect */
    function initBackgroundCanvas() {
      const canvas = document.getElementById('dust-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const count = Math.min(Math.floor(window.innerWidth / 22), 35);

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.8 + 0.6,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.6 + 0.2,
          color: Math.random() > 0.5 ? '0, 242, 152' : '0, 180, 216'
        });
      }

      function loop() {
        ctx.clearRect(0, 0, width, height);

        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
          ctx.fill();
        });

        requestAnimationFrame(loop);
      }

      loop();
    }

    /* Copy phone number and native share */
    function initActions() {
      const copyBtn = document.getElementById('btn-copy-num');
      const shareBtn = document.getElementById('btn-share-profile');
      const phoneNumber = '0633323534';

      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(phoneNumber).then(() => {
            showToast(`تم نسخ رقم الهاتف: ${phoneNumber} 📋`);
          }).catch(() => {
            showToast(`رقم الهاتف: ${phoneNumber}`);
          });
        });
      }

      if (shareBtn) {
        shareBtn.addEventListener('click', () => {
          if (navigator.share) {
            navigator.share({
              title: 'Anouar Iqqi | أنوار إقي',
              text: 'الحسابات الرسمية للكوتش والرياضي أنوار إقي',
              url: window.location.href
            }).catch(() => {});
          } else {
            navigator.clipboard.writeText(window.location.href).then(() => {
              showToast('تم نسخ رابط الصفحة للمشاركة! 🔗');
            });
          }
        });
      }
    }

    /* Toast message */
    function showToast(text) {
      let toast = document.getElementById('toast-box');
      if (!toast) return;

      toast.innerHTML = `<i class="fas fa-check-circle" style="color: #00f298;"></i> <span>${text}</span>`;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2800);
    }
  </script>
